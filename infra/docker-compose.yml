services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: boutik
      POSTGRES_PASSWORD: boutik
      POSTGRES_DB: boutik
    ports:
      - "5432:5432"
    volumes:
      - boutik_pg:/var/lib/postgresql/data

  postgres-test:
    image: postgres:16
    profiles: ["test"]
    environment:
      POSTGRES_USER: boutik
      POSTGRES_PASSWORD: boutik
      POSTGRES_DB: boutik_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  boutik_pg:
