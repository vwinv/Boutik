# Blueprint Render — API Nest Boutik (monorepo pnpm)
# Dashboard → New → Blueprint → sélectionner ce repo
services:
  - type: web
    name: boutik-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: |
      corepack enable
      pnpm install --frozen-lockfile
      pnpm --filter @boutik/domain build
      pnpm --filter @boutik/config build
      pnpm --filter @boutik/api exec prisma generate
      pnpm --filter @boutik/api build
    startCommand: |
      pnpm --filter @boutik/api exec prisma migrate deploy
      pnpm --filter @boutik/api start
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: boutik-db
          property: connectionString
      - key: PUBLIC_ORIGIN
        sync: false
      - key: API_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL_SECONDS
        value: "3600"
      - key: JWT_REFRESH_TTL_SECONDS
        value: "2592000"

databases:
  - name: boutik-db
    plan: free
    databaseName: boutik
    user: boutik
